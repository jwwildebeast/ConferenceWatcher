# Curated conferences not covered by the CS/AI deadline aggregators (ai-deadlines,
# ccf-deadlines) -- mainly industrial & systems engineering / OR / simulation venues.
#
# manual_base_score (0-100) is YOUR judgment call, not a computed value -- edit it
# freely. score.py adds small, documented adjustments on top (years running,
# sponsor-society tier) but never overrides this base.
#
# deadlines left as `null` are genuinely unverified -- don't trust a guess here.
# scrape.url is checked by scrape_seed.py on every pipeline run; when the page
# text changes it's flagged in the changelog for you to confirm and fill in,
# rather than being auto-parsed (these pages aren't structured enough to parse
# reliably without risking a wrong date).

- id: iise-annual
  title: IISE Annual Conference & Expo
  full_name: Institute of Industrial and Systems Engineers Annual Conference & Expo
  sponsor: IISE
  years_running: 75
  manual_base_score: 75
  score_rationale: >
    Flagship annual conference of IISE, the primary professional society for
    industrial & systems engineers; broad research + case-study tracks, long
    running history, ProQuest-indexed proceedings.
  link: https://www.iise.org/annual/
  scrape:
    url: https://www.iise.org/annual/
  instances:
